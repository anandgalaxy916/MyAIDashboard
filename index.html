<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#090f1e"><meta name="description" content="Private AI intelligence, opportunities and action dashboard"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><title>AI Foresight | Personal Intelligence OS</title><style>
:root{color-scheme:dark;--bg:#090f1e;--panel:#131f34;--panel2:#182942;--line:#293b56;--text:#eef5ff;--muted:#a1b2cb;--accent:#88b9ff;--green:#65dbb0;--orange:#ffc47d}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 80% -15%,#1b3355,transparent 48%),var(--bg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.shell{max-width:1190px;margin:auto;display:grid;grid-template-columns:216px minmax(0,1fr);min-height:100dvh}.sidebar{border-right:1px solid var(--line);padding:24px 13px;position:sticky;top:0;height:100dvh}.brand{display:flex;gap:10px;align-items:center;padding:6px 10px 27px}.brand-icon{border-radius:13px;background:linear-gradient(130deg,#3a77d5,#22a2a8);width:43px;height:43px;display:grid;place-items:center;font-size:23px}.brand strong{display:block;letter-spacing:.07em}.brand small{font-size:10px;color:var(--muted)}nav{display:grid;gap:5px}nav button,.bottomnav button{background:none;border:0;color:var(--muted);text-align:left;padding:12px 13px;border-radius:12px}nav button.active,.bottomnav button.active{color:white;background:#243b5c}nav button:hover{background:#1d304a}.side-note{font-size:12px;color:var(--muted);padding:17px 12px}.main{min-width:0;padding:26px 30px 92px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);font-weight:750}.title{font-size:clamp(27px,4vw,37px);line-height:1.15;margin:8px 0 8px;letter-spacing:-.045em}.sub{color:var(--muted);margin:0 0 22px}.tag{display:inline-block;color:var(--green);background:#153d3a;border:1px solid #2c7163;border-radius:30px;padding:5px 11px;font-size:11px;font-weight:700}.btn{border:1px solid var(--line);background:#1c304d;color:var(--text);border-radius:11px;padding:10px 13px;font-weight:650}.btn.primary{background:#437ede;border-color:#659df3;color:white}.btn:hover{filter:brightness(1.14)}.btn.small{padding:6px 10px;font-size:12px}.hero{border:1px solid #345477;background:linear-gradient(120deg,#192e50,#102137 80%);border-radius:22px;padding:23px;margin:21px 0}.hero h2{font-size:24px;letter-spacing:-.035em;line-height:1.22;margin:5px 0 8px}.hero p{color:#c7d5e8;margin:0}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:11px}.stat,.card,.section{background:var(--panel);border:1px solid var(--line);border-radius:17px}.stat{padding:15px}.stat .num{font-size:27px;font-weight:800;line-height:1.2}.stat .lab{color:var(--muted);font-size:12px}.section{padding:18px;margin-top:17px}.section h3{font-size:17px;margin:0 0 13px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{padding:17px;display:flex;flex-direction:column;gap:10px;min-height:176px}.card h3{font-size:17px;line-height:1.33;margin:0}.card p{color:var(--muted);margin:0;font-size:13px;flex:1}.card .meta{color:var(--accent);font-size:10px;letter-spacing:.07em;font-weight:800}.cardfoot{display:flex;align-items:center;justify-content:space-between;gap:7px}.muted{color:var(--muted)}.mini{font-size:12px}.bookmark{border:1px solid var(--line);background:#20334c;color:#a9bfdc;border-radius:10px;padding:6px 10px}.bookmark.on{color:#ffdf8b;border-color:#967f43}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:18px 0}.field{border:1px solid var(--line);background:#17273e;color:var(--text);padding:11px 12px;border-radius:11px;min-width:0}.search{flex:1;min-width:175px}.pill{font-size:11px;color:var(--orange);background:#3a2c23;padding:4px 9px;border-radius:20px}.empty{text-align:center;padding:40px 16px;color:var(--muted);background:var(--panel);border-radius:16px}.progress{height:7px;background:#273b56;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:var(--green);transition:width .2s}.task{display:flex;align-items:start;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.task:last-child{border:0}.task input{accent-color:#65dbb0;margin-top:6px;width:17px;height:17px}.task strong{display:block}.task.done strong{text-decoration:line-through;color:var(--muted)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.formgrid .wide{grid-column:1/-1}.formgrid input,.formgrid select,.formgrid textarea{width:100%}.formgrid textarea{min-height:76px}.notice{border:1px solid #526b8a;background:#1b2e47;padding:12px;border-radius:12px;font-size:12px;color:#c7d7ec}.bottomnav{display:none}.hide{display:none!important}a{color:#9ec8ff}a:hover{text-decoration:none}.bar{height:8px;background:#2c3f5b;border-radius:6px;margin-top:7px}.bar span{height:100%;display:block;border-radius:6px;background:#5a9be7}.chip{font-size:12px;border-radius:8px;padding:4px 7px;background:#223c57;color:#b4d0f7}.section .card{background:var(--panel2)}@media(max-width:800px){.shell{display:block}.sidebar{display:none}.main{padding:19px 16px 100px}.bottomnav{position:fixed;z-index:10;bottom:0;left:0;right:0;display:grid;grid-template-columns:repeat(5,1fr);background:#0d1729f5;border-top:1px solid var(--line);padding:6px 4px calc(7px + env(safe-area-inset-bottom))}.bottomnav button{text-align:center;padding:6px 1px;font-size:10px;display:flex;flex-direction:column;align-items:center;gap:3px}.bottomnav .navicon{font-size:20px}.stats{grid-template-columns:repeat(2,1fr)}.cards{grid-template-columns:1fr}.hero{padding:19px}.formgrid{grid-template-columns:1fr}.formgrid .wide{grid-column:auto}}@media(min-width:810px) and (max-width:1100px){.sidebar{width:190px}.shell{grid-template-columns:190px 1fr}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div class="shell"><aside class="sidebar"><div class="brand"><div class="brand-icon">◈</div><div><strong>AI FORESIGHT</strong><small>PERSONAL INTELLIGENCE OS</small></div></div><nav id="sideNav"></nav><div class="side-note">LIVE FEED · Refresh to sync verified headlines<br>Saved progress stays on this device.</div></aside><main class="main"><div class="top"><span class="eyebrow" id="sectionLabel">INTELLIGENCE CENTRE</span><span class="tag">● LIVE FEED READY</span></div><div id="app"></div></main></div><div class="bottomnav" id="bottomNav"></div><script>
'use strict';const pages=[['home','⌂','Home'],['news','◉','AI News'],['opportunities','✧','Opportunities'],['funding','◇','Funding'],['learning','▤','Learning'],['actions','✓','Actions']];const seed=[{id:'n1',type:'news',category:'Agentic AI',title:'Agentic workflow reliability',description:'Research how models plan, use tools and recover from errors in multi-step enterprise processes.',priority:5,date:'2026-10-18',url:'https://openai.com/news/',source:'Research topic · OpenAI news',sample:true},{id:'n2',type:'news',category:'Models',title:'Model capability and cost comparisons',description:'Compare frontier and open-weight models before choosing the right product architecture.',priority:4,date:'2026-10-17',url:'https://huggingface.co/models',source:'Research topic · Hugging Face',sample:true},{id:'n3',type:'news',category:'Enterprise',title:'Enterprise AI adoption patterns',description:'Examine governance, human review and measurable ROI for operational AI systems.',priority:4,date:'2026-10-16',url:'https://www.anthropic.com/news',source:'Research topic · Anthropic',sample:true},{id:'n4',type:'news',category:'Multimodal',title:'Voice and visual intelligence',description:'Explore opportunities combining document understanding, real-time audio and visual interfaces.',priority:3,date:'2026-10-15',url:'https://deepmind.google/discover/blog/',source:'Research topic · DeepMind',sample:true},{id:'o1',type:'opportunities',category:'Venture idea',title:'Personal AI digital representatives',description:'Interview potential users about the problems CloneU could solve. Assess trust, privacy and willingness to pay.',priority:5,date:'2026-10-18',url:'',source:'Venture hypothesis',sample:true},{id:'o2',type:'opportunities',category:'Vertical AI',title:'Document quality assurance agent',description:'Prototype a first-time-right document review workflow with clear human approval checkpoints.',priority:5,date:'2026-10-17',url:'',source:'Business experiment',sample:true},{id:'o3',type:'opportunities',category:'AI SaaS',title:'SMB workflow automation',description:'Look for repetitive back-office tasks that small companies will pay to automate.',priority:4,date:'2026-10-15',url:'',source:'Opportunity hypothesis',sample:true},{id:'f1',type:'funding',category:'India',title:'Startup India programs',description:'Check current eligibility, incorporation requirements and application windows on the official portal.',priority:5,date:'2026-10-18',url:'https://www.startupindia.gov.in/',source:'Official portal · Not verified as open',sample:true,deadline:''},{id:'f2',type:'funding',category:'Bengaluru',title:'NSRCEL founder programs',description:'Review relevant programs, mentors and current cohorts; verify whether pre-incorporation founders qualify.',priority:5,date:'2026-10-18',url:'https://nsrcel.org/',source:'Official portal · Not verified as open',sample:true,deadline:''},{id:'f3',type:'funding',category:'Global',title:'Y Combinator applications',description:'Review the current batch, application dates and eligibility directly before applying.',priority:4,date:'2026-10-18',url:'https://www.ycombinator.com/apply',source:'Official portal · Not verified as open',sample:true,deadline:''},{id:'f4',type:'funding',category:'India AI',title:'IndiaAI initiatives',description:'Follow relevant funding, challenges and compute initiatives. Verify the individual program’s status.',priority:5,date:'2026-10-18',url:'https://indiaai.gov.in/',source:'Official portal · Not verified as open',sample:true,deadline:''}];const lessonSeed=[{id:'l1',title:'LLM basics and inference economics',minutes:30},{id:'l2',title:'Prompting and structured outputs',minutes:35},{id:'l3',title:'Build an agent with tools',minutes:60},{id:'l4',title:'RAG, retrieval and citations',minutes:45},{id:'l5',title:'Evaluate AI quality and risks',minutes:40},{id:'l6',title:'Validate a startup hypothesis',minutes:45}];const actionSeed=[{id:'a1',title:'Interview three potential CloneU users',detail:'Record problems, current alternatives and willingness to pay',done:false},{id:'a2',title:'Compare two AI agent frameworks',detail:'Benchmark reliability, speed and API costs',done:false},{id:'a3',title:'Review incorporation eligibility for accelerators',detail:'Create a shortlist with verified program rules',done:false}];const KEY='aiforesight-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}}state={saved:[],doneLessons:[],actions:actionSeed,extra:[],page:'home',...state};let liveItems=[];let liveMeta={status:'idle',last:null,error:''};let filters={q:'',category:'All',sort:'priority',savedOnly:false};let showAdd=false;const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){alert('Device storage unavailable. Changes may not persist.')}};const data=()=>[...liveItems,...seed,...state.extra];const bookmark=id=>{state.saved=state.saved.includes(id)?state.saved.filter(x=>x!==id):[...state.saved,id];persist();render()};const nav=page=>{state.page=page;filters={q:'',category:'All',sort:'priority',savedOnly:false};showAdd=false;persist();render();scrollTo(0,0)};const categories=items=>['All',...new Set(items.map(x=>x.category))];const filtered=items=>items.filter(x=>(filters.category==='All'||x.category===filters.category)&&(!filters.savedOnly||state.saved.includes(x.id))&&(`${x.title} ${x.description} ${x.category}`.toLowerCase().includes(filters.q.toLowerCase()))).sort((a,b)=>filters.sort==='recent'?b.date.localeCompare(a.date):filters.sort==='title'?a.title.localeCompare(b.title):b.priority-a.priority||b.date.localeCompare(a.date));function card(x){return `<article class="card"><div class="row"><span class="meta">${esc(x.category)} · ${esc(x.date)}</span><button class="bookmark ${state.saved.includes(x.id)?'on':''}" data-bookmark="${esc(x.id)}" aria-label="${state.saved.includes(x.id)?'Remove bookmark':'Bookmark'} ${esc(x.title)}">${state.saved.includes(x.id)?'★':'☆'}</button></div><h3>${esc(x.title)}</h3><p>${esc(x.description)}</p><div class="cardfoot"><span class="mini muted">${esc(x.source||'Personal entry')} ${x.sample?'· SAMPLE':''}</span><span class="chip">Impact ${x.priority}/5</span></div>${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener noreferrer" class="mini">View source ↗</a>`:''}${x.deadline?`<div class="mini">Deadline: ${esc(x.deadline)}</div>`:''}</article>`}function controls(items){return `<div class="controls"><input class="field search" id="search" type="search" placeholder="Search this section" value="${esc(filters.q)}" aria-label="Search"><select class="field" id="category" aria-label="Category">${categories(items).map(c=>`<option value="${esc(c)}" ${filters.category===c?'selected':''}>${esc(c)}</option>`).join('')}</select><select class="field" id="sort" aria-label="Sort"><option value="priority" ${filters.sort==='priority'?'selected':''}>Highest impact</option><option value="recent" ${filters.sort==='recent'?'selected':''}>Newest</option><option value="title" ${filters.sort==='title'?'selected':''}>A–Z</option></select><label class="mini"><input id="savedOnly" type="checkbox" ${filters.savedOnly?'checked':''}> Bookmarked only</label></div>`}function collection(type){let names={news:['AI News','Monitor trends and breakthroughs. All seeded items are research prompts, not verified news.'],opportunities:['Opportunities','Test business hypotheses, compare markets and save promising ideas.'],funding:['Funding Radar','Program watchlist only. No application or deadline is verified in this offline demo.']};let [title,sub]=names[type],items=data().filter(x=>x.type===type);return `<h1 class="title">${title}</h1><p class="sub">${sub}</p><div class="notice">${type==='news'?`Live feed status: ${esc(liveMeta.status)} ${liveMeta.last?'· Updated '+esc(liveMeta.last):''} ${liveMeta.error?'· '+esc(liveMeta.error):''} · Sample cards remain marked SAMPLE.`:'Opportunity and funding leads remain watchlists, not verified live applications.'}</div>${type==='news'?'<button class="btn primary" id="refreshFeed">↻ Refresh live headlines</button>':''}${controls(items)}<div class="row"><span class="mini muted"><span id="count">${filtered(items).length}</span> entries</span><button class="btn small" id="addButton">+ Add item</button></div><div id="addForm">${showAdd?form(type):''}</div><div class="cards" id="results" style="margin-top:13px">${filtered(items).map(card).join('')||'<div class="empty">No matching items. Change your filters.</div>'}</div>`}function form(type){return `<form class="section" id="newItem"><h3>Add a personal ${type==='news'?'news note':type==='funding'?'funding lead':'opportunity'}</h3><div class="formgrid"><input class="field wide" name="title" placeholder="Title" maxlength="120" required><input class="field" name="category" placeholder="Category" maxlength="40" required><select class="field" name="priority"><option value="5">Impact 5</option><option value="4">Impact 4</option><option value="3">Impact 3</option><option value="2">Impact 2</option><option value="1">Impact 1</option></select><textarea class="field wide" name="description" placeholder="Why it matters" maxlength="400" required></textarea><input class="field wide" name="url" type="url" placeholder="Official source URL (optional)"><button class="btn primary" type="submit">Save entry</button></div></form>`}function home(){const bookmarkItems=data().filter(x=>state.saved.includes(x.id)).slice(0,4),done=state.actions.filter(x=>x.done).length;return `<h1 class="title">Stay ahead. Build what's next.</h1><p class="sub">One private place for AI intelligence and founder action.</p><div class="hero"><span class="eyebrow">YOUR PERSONAL AI COMMAND CENTRE</span><h2>From information to advantage.</h2><p>Monitor emerging AI capabilities, explore startup opportunities, learn systematically, and turn ideas into action.</p><p class="mini" style="margin-top:10px;color:#8fe3c1">Live headlines available after server deployment · personal progress stored locally</p></div><div class="stats"><div class="stat"><div class="num">${data().filter(x=>x.type==='news').length}</div><div class="lab">Research topics</div></div><div class="stat"><div class="num">${data().filter(x=>x.type==='opportunities').length}</div><div class="lab">Opportunities</div></div><div class="stat"><div class="num">${state.saved.length}</div><div class="lab">Bookmarks</div></div><div class="stat"><div class="num">${done}/${state.actions.length}</div><div class="lab">Actions done</div></div></div><div class="section"><div class="row"><h3>Your saved intelligence</h3><button class="btn small" id="goNews">Explore →</button></div><div class="cards">${bookmarkItems.map(card).join('')||'<div class="empty">Tap ☆ on any item to save it here.</div>'}</div></div><div class="section"><div class="row"><h3>Current focus</h3><span class="chip">U2 / CloneU</span></div><p class="muted">Validate the customer problem, confirm technical feasibility, and assess your first commercially testable workflow.</p><button class="btn" id="goActions">Review next actions →</button></div>`}function learning(){let done=state.doneLessons.length;return `<h1 class="title">Learning Lab</h1><p class="sub">Learn the capabilities that help you build and lead with AI.</p><div class="section"><div class="row"><strong>${done} of ${lessonSeed.length} lessons completed</strong><span class="mini">${Math.round(done/lessonSeed.length*100)}%</span></div><div class="progress"><div style="width:${done/lessonSeed.length*100}%"></div></div>${lessonSeed.map((x,i)=>`<label class="task ${state.doneLessons.includes(x.id)?'done':''}"><input type="checkbox" data-lesson="${x.id}" ${state.doneLessons.includes(x.id)?'checked':''}><span><strong>${i+1}. ${esc(x.title)}</strong><span class="mini muted">${x.minutes} minute learning activity</span></span></label>`).join('')}</div><div class="section"><h3>Hands-on challenge</h3><p class="muted">Design a small agent that reads one document, checks a rule and produces a structured response. Verify the output against a human-reviewed reference.</p></div>`}function actions(){let done=state.actions.filter(x=>x.done).length;return `<h1 class="title">Action Tracker</h1><p class="sub">Convert intelligence into experiments, outreach and real outcomes.</p><div class="section"><div class="row"><strong>${done} / ${state.actions.length} complete</strong><button class="btn small" id="addAction">+ New action</button></div><div class="progress"><div style="width:${state.actions.length?done/state.actions.length*100:0}%"></div></div>${showAdd?'<form id="actionForm" style="margin-top:15px;display:flex;gap:8px;flex-wrap:wrap"><input class="field" name="title" maxlength="150" placeholder="Next action" required style="flex:1"><button class="btn primary">Add</button></form>':''}${state.actions.map(x=>`<div class="task ${x.done?'done':''}"><input type="checkbox" data-action="${esc(x.id)}" ${x.done?'checked':''}><div style="flex:1"><strong>${esc(x.title)}</strong><span class="mini muted">${esc(x.detail)}</span></div><button class="btn small" data-deleteaction="${esc(x.id)}" aria-label="Delete ${esc(x.title)}">×</button></div>`).join('')||'<div class="empty">No actions yet.</div>'}</div><div class="section"><h3>Make it measurable</h3><p class="muted">Prioritize customer conversations, proof-of-concept results, applications submitted and real partnerships over the amount of AI news consumed.</p></div>`}function render(){document.querySelector('#sideNav').innerHTML=pages.map(p=>`<button data-nav="${p[0]}" class="${state.page===p[0]?'active':''}">${p[1]} &nbsp; ${p[2]}</button>`).join('');let bottom=[pages[0],pages[1],pages[2],pages[4],pages[5]];document.querySelector('#bottomNav').innerHTML=bottom.map(p=>`<button data-nav="${p[0]}" class="${state.page===p[0]?'active':''}"><span class="navicon">${p[1]}</span>${p[2]}</button>`).join('');document.querySelector('#sectionLabel').textContent=state.page==='home'?'INTELLIGENCE CENTRE':state.page.toUpperCase();document.querySelector('#app').innerHTML=state.page==='home'?home():['news','opportunities','funding'].includes(state.page)?collection(state.page):state.page==='learning'?learning():actions()};document.addEventListener('click',e=>{let n=e.target.closest('[data-nav]');if(n){nav(n.dataset.nav);return}let b=e.target.closest('[data-bookmark]');if(b){bookmark(b.dataset.bookmark);return}if(e.target.closest('#refreshFeed'))refreshLive();if(e.target.closest('#goActions'))nav('actions');if(e.target.closest('#goNews'))nav('news');if(e.target.closest('#addButton')||e.target.closest('#addAction')){showAdd=!showAdd;render()}let d=e.target.closest('[data-deleteaction]');if(d){state.actions=state.actions.filter(a=>a.id!==d.dataset.deleteaction);persist();render()}});document.addEventListener('input',e=>{if(e.target.id==='search'){let start=e.target.selectionStart;filters.q=e.target.value;refreshResults();let el=document.querySelector('#search');el?.focus();el?.setSelectionRange(start,start)}});document.addEventListener('change',e=>{if(e.target.id==='category'||e.target.id==='sort'||e.target.id==='savedOnly'){filters.category=document.querySelector('#category')?.value||'All';filters.sort=document.querySelector('#sort')?.value||'priority';filters.savedOnly=!!document.querySelector('#savedOnly')?.checked;refreshResults()}if(e.target.dataset.lesson){let id=e.target.dataset.lesson;state.doneLessons=e.target.checked?[...new Set([...state.doneLessons,id])]:state.doneLessons.filter(x=>x!==id);persist();render()}if(e.target.dataset.action){let a=state.actions.find(x=>x.id===e.target.dataset.action);if(a)a.done=e.target.checked;persist();render()}});function refreshResults(){let items=data().filter(x=>x.type===state.page);let res=document.querySelector('#results');if(res)res.innerHTML=filtered(items).map(card).join('')||'<div class="empty">No matching items. Change your filters.</div>';let count=document.querySelector('#count');if(count)count.textContent=filtered(items).length}document.addEventListener('submit',e=>{if(e.target.id==='newItem'){e.preventDefault();let f=new FormData(e.target);let url=String(f.get('url')||'');if(url&&!/^https?:\/\//i.test(url))return alert('Only HTTP(S) source links are supported.');state.extra.push({id:'u'+Date.now(),type:state.page,title:String(f.get('title')),category:String(f.get('category')),description:String(f.get('description')),priority:Number(f.get('priority')),date:new Date().toISOString().slice(0,10),url,source:'Personal note',sample:false});persist();showAdd=false;render()}if(e.target.id==='actionForm'){e.preventDefault();let t=new FormData(e.target).get('title');state.actions.push({id:'a'+Date.now(),title:String(t),detail:'Personal action',done:false});persist();showAdd=false;render()}});async function refreshLive(){liveMeta.status='loading';liveMeta.error='';render();try{const resp=await fetch('/.netlify/functions/feed',{cache:'no-store'});if(!resp.ok)throw new Error('Server returned '+resp.status);const obj=await resp.json();if(!Array.isArray(obj.items))throw new Error('Unexpected response');liveItems=obj.items.filter(x=>x&&typeof x.id==='string'&&x.type==='news'&&/^https:\/\//.test(x.url)).slice(0,80);liveMeta.status=liveItems.length?'connected':'no articles';liveMeta.last=new Date().toLocaleString();try{sessionStorage.setItem('aiforesight-live',JSON.stringify({items:liveItems,last:liveMeta.last}))}catch{}}catch(e){liveMeta.status='offline';liveMeta.error=String(e.message||e)}render()}try{const c=JSON.parse(sessionStorage.getItem('aiforesight-live')||'null');if(c&&Array.isArray(c.items)){liveItems=c.items;liveMeta={status:'cached',last:c.last,error:''}}}catch{}render();if(location.protocol.startsWith('http'))refreshLive();if('serviceWorker'in navigator&&location.protocol!=='file:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
